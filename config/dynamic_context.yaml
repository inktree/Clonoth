# 动态上下文变量注册表
# 每个变量是一个 Python 表达式，每轮评估一次，结果注入 prompt 模板变量（{{key}}）
#
# eval 上下文中可用的对象：
#   task_context (dict)  — supervisor 塞的通用元数据，所有 key 也展开到顶层
#   session_id (str)     — 当前 session ID
#   node_id (str)        — 当前节点 ID
#   prompt_tokens (int)  — 上一轮 LLM prompt token 数
#   compact_threshold (int) — 压缩阈值
#   datetime / timezone / timedelta — Python datetime 模块
#
# 以后加新元数据：只需在 supervisor/task_store.py 的 task_context 里加字段，
# 然后在这里写表达式引用即可，不用改 engine 代码。
variables:
  # --- 来自 supervisor task_context ---
  conversation_key: "task_context.get('conversation_key', 'unknown')"
  channel: "'私聊' if task_context.get('channel','')=='discord_dm' else '群聊' if task_context.get('channel','').startswith('discord') else task_context.get('channel','')"
  message_id: "task_context.get('message_id', '')"
  entry_node_id: "task_context.get('entry_node_id', '')"
  session_generation: "str(task_context.get('session_generation', 0))"
  is_system_task: "str(task_context.get('is_system_task', False))"
  switched_from: "task_context.get('switched_from', '')"
  # --- 运行时计算 ---
  beijing_time: "datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M CST')"
  context_utilization: |-
    (str(min(999, prompt_tokens * 100 // compact_threshold)) + '% (' + str(prompt_tokens) + '/' + str(compact_threshold) + ' tokens)') if compact_threshold else 'N/A'
  # Legacy templates still reference project_tree. The opt-in workspace_context
  # plugin now supplies the session-scoped tree; do not run find in the engine cwd.
  project_tree: "''"
